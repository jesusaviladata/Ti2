services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: infra-backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - infra-net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips=*
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: infra-frontend
    env_file: .env
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - infra-net

  db:
    image: postgres:16-alpine
    container_name: infra-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - infra-net


  nginx:
    image: nginx:alpine
    container_name: infra-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/certbot:/var/www/certbot        # reto ACME de Certbot (renovación TLS)
    depends_on:
      - backend
      - frontend
    networks:
      - infra-net

volumes:
  postgres_data:

networks:
  infra-net:
    driver: bridge
